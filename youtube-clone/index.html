<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube</title>
  <!-- Favicon: YouTube Red Play Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF0000'%3E%3Cpath d='M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z'/%3E%3C/svg%3E">

  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'yt-red': '#FF0000',
            'yt-dark-bg': '#0F0F0F',
            'yt-dark-surface': '#222222',
            'yt-dark-hover': '#272727',
            'yt-dark-border': '#3F3F3F',
            'yt-dark-text': '#F1F1F1',
            'yt-dark-muted': '#AAAAAA',
            'yt-light-bg': '#FFFFFF',
            'yt-light-surface': '#F2F2F2',
            'yt-light-hover': '#E5E5E5',
            'yt-light-border': '#CCCCCC',
            'yt-light-text': '#0F0F0F',
            'yt-light-muted': '#606060'
          }
        }
      }
    };
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- React 19 / 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Global YT Namespace & Module Interop Shim -->
  <script>
    window.YT = window.YT || {};
    window.exports = window.YT;
    window.require = function(modulePath) {
      return window.YT;
    };
  </script>
</head>
<body class="bg-white dark:bg-[#0F0F0F] text-neutral-900 dark:text-[#F1F1F1] min-h-screen">
  <div id="root"></div>

  <!-- Application Modules & Components in Dependency Order -->
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/data/videos.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/store/state.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/Icons.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/Header.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/Sidebar.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/CategoryPills.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/VideoCard.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/VideoGrid.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/VideoPlayer.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/CommentSection.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/WatchPage.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/SearchResults.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/components/ChannelPage.js"></script>
  <script type="text/babel" data-plugins="transform-modules-commonjs" src="js/app.js"></script>
</body>
</html>
